<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Viagem</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding: 40px;
        }

        input {
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #mensagem {
            margin: 20px;
            font-size: 20px;
        }

        #contador {
            font-size: 30px;
            font-weight: bold;
            margin: 15px;
        }

        .destacada {
            color: white;
            background-color: #0077b6;
            font-size: 28px;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1 id="titulo">Painel da Viagem </h1>

    <input id="cidadi" type="text" placeholder="Digite uma cidade">

    <button id="botaoCidade">
        Exibi mensagem
    </button>

    <p id="mensagem"></p>

    <button id="botaoEstilo">
        Destaca mensagem
    </button>

    <h2>Contador</h2>

    <button id="botaoMenos">-</button>

    <span id="contador">10</span>

    <button id="botaoMais">+</button>

    <script src="2,3.js"></script>

</body>
</html>
